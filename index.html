<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameFinder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>FrameFinder</h1>
    <p class="tagline">Find images based on your interests</p>
  </header>

  <main>
    <form id="search-form" class="search-form" role="search">
      <label for="search-input" class="visually-hidden">Search images by keyword</label>
      <input
        type="search"
        id="search-input"
        name="query"
        placeholder="Search for images, e.g. mountains"
        autocomplete="off"
      >

      <label for="category-select" class="visually-hidden">Choose a category</label>
      <select id="category-select" name="category">
        <option value="">All categories</option>
        <option value="nature">Nature</option>
        <option value="city">City</option>
        <option value="animals">Animals</option>
        <option value="food">Food</option>
        <option value="travel">Travel</option>
        <option value="technology">Technology</option>
      </select>

      <button type="submit">Search</button>
    </form>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="results" class="results-grid" aria-label="Image results"></section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 FrameFinder</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
